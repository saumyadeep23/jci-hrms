server:
  port: 8080
  # Off by default so `mvn spring-boot:run` keeps working with zero setup for anyone without a local
  # mkcert cert (certs/ is gitignored, machine-specific). Set SERVER_SSL_ENABLED=true to serve HTTPS with
  # the mkcert-generated keystore below - needed so a phone's camera/geolocation APIs (secure-context-only,
  # and localhost's usual exception doesn't cover a LAN address) work when testing the mobile punch flow.
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:file:../certs/dev-keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: jci-hrms-dev

spring:
  application:
    name: jci-hrms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jcihrms?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:jcihrms_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Real IdP (Keycloak/Auth0/etc.) not yet provisioned for any environment.
          # Blank by default everywhere. SecurityConfig.jwtDecoder() no longer infers
          # anything from this being blank on its own (SEC-001,
          # docs/security/SEC_001_002_REMEDIATION.md) - which decoder is built is
          # governed explicitly by security.auth.mode below, and
          # AuthenticationModeGuard refuses to start a production-like deploy
          # (SPRING_PROFILES_ACTIVE=staging|prod) that reaches this bean with
          # security.auth.mode=oidc and this still blank. Set this once a real
          # issuer exists.
          issuer-uri: ${JWT_ISSUER_URI:}
  cache:
    cache-names: pincodeCache,ifscCache
    caffeine:
      # FR-EMP.14: India Post pincode->district/state and bank IFSC->branch both
      # rarely change, so a long TTL is safe and meaningfully cuts outbound
      # calls/latency to the lookup proxies.
      spec: expireAfterWrite=24h,maximumSize=5000
  servlet:
    multipart:
      # PIMS_SPEC.md Step 8 (Document Verification & Final Review) uploads -
      # per-file and per-request caps; MIME/extension whitelisting is
      # enforced in the upload service itself, not here.
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# SEC-001 (docs/security/SEC_001_002_REMEDIATION.md): security.auth.mode is the
# explicit, positive switch between the two SecurityConfig.jwtDecoder() paths -
# "oidc" (real OIDC issuer, issuer-uri above must be set) or "local-dev" (the
# HS256 fallback below). Defaults to local-dev so `mvn spring-boot:run`/tests
# keep working with zero setup, but AuthenticationModeGuard refuses to honor
# local-dev (or an unset/unrecognized mode) once SPRING_PROFILES_ACTIVE marks
# the environment staging/prod - see SecurityConfig.jwtDecoder() javadoc.
#
# local-dev-secret is the local/test-only JWT signing secret for that HS256
# fallback - NEVER reuse this default outside local dev/CI.
security:
  auth:
    mode: ${SECURITY_AUTH_MODE:local-dev}
  jwt:
    local-dev-secret: ${JWT_LOCAL_DEV_SECRET:local-dev-only-secret-key-never-use-in-production-32bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# PIMS_SPEC.md Section 3.C - LocalStorageServiceImpl's storage root.
# A local-disk stand-in for the eventual S3 bucket; swap the
# DocumentStorageService bean for an S3-backed one when that's provisioned.
hrms:
  storage:
    local-dir: ${HRMS_STORAGE_LOCAL_DIR:./uploads}
  # RBAC_SECURITY_REQUIREMENTS.md / ONBOARDING_SECURITY_REQUIREMENTS.md - see
  # SystemAdminBootstrapRunner / UserOnboardingService.
  bootstrap:
    system-admin-employee-id: ${HRMS_BOOTSTRAP_SYSTEM_ADMIN_EMPLOYEE_ID:8}
  onboarding:
    invitation-validity-hours: ${HRMS_ONBOARDING_INVITATION_VALIDITY_HOURS:24}
  frontend:
    base-url: ${HRMS_FRONTEND_BASE_URL:http://localhost:5173}

# PLACEHOLDER figures, not confirmed JCI wage-settlement policy - see
# PayrollRateProperties javadoc. Override once the real numbers are known.
payroll:
  rates:
    hra-percent-x: 24.00
    hra-percent-y: 16.00
    hra-percent-z: 8.00
    transport-allowance-base: 1600.00

# PLACEHOLDER figures, not confirmed JCI Trust/EPS scheme policy - see
# CpfTrustPolicyProperties javadoc. Override once the real numbers are known.
cpf:
  trust:
    settlement-due-days: 30
    eps-minimum-pensionable-service-years: 10
